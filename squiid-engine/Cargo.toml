[package]
name = "squiid-engine"
version = "1.2.0"
description = "This repository contains the RPN (postfix) evaluation engine that is used in Squiid Calculator"
repository = "https://gitlab.com/ImaginaryInfinity/squiid-calculator/squiid-parser"
license = "GPL-3.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
backtrace = { version = "0.3.69", optional = true }
chrono = { version = "0.4.30", default-features = false, optional = true, features = [
    "clock",
    "std",
] }
colored = { version = "2.0.4", optional = true }
regex = "1.7.3"
rust_decimal = { version = "1.29.1", features = ["maths"] }
rust_decimal_macros = "1.29.1"
serde = { version = "1.0.159", features = ["derive"] }
serde_json = "1.0.95"

[profile.release]
strip = "symbols"
lto = true

[features]
default = ["crash-reporting"]
crash-reporting = ["dep:backtrace", "dep:chrono", "dep:colored"]
ffi = []

[lib]
name = "squiid_engine"
crate-type = ["lib", "cdylib"]
path = "src/lib.rs"
required-features = ["ffi"]
